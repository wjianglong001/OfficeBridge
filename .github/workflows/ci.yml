name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:win
      - run: npm run test:exe
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeBridge-windows-x64
          path: release/
